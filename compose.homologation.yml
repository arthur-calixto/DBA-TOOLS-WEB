services:
  analise-ambiente-hml:
    image: ${APP_IMAGE:?Defina APP_IMAGE}
    container_name: analise-ambiente-hml
    ports:
      - "127.0.0.1:8591:8590"
    env_file:
      - ${HML_ENV_FILE:?Defina HML_ENV_FILE}
    environment:
      SHARED_DIR: /app/data
    volumes:
      - type: bind
        source: ${HML_DATA_DIR:?Defina HML_DATA_DIR}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    # Limites conservadores para não competir indevidamente com produção.
    # Ajuste estes valores somente após observar o consumo na VM.
    cpus: "1.00"
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8590/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
