name: Deploy de homologação
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Commit da develop a validar e implantar'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-homologation
  cancel-in-progress: false
jobs:
  test-and-build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar commit da develop
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Informe um SHA completo de commit'; exit 1; }
          git merge-base --is-ancestor "$REVISION" origin/develop
          git checkout --detach "$REVISION"
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Definir imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:hml-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Registrar imagem publicada
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: printf 'Imagem de homologação publicada %s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, analise-producao]
    environment: homologation
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.test-and-build.outputs.image }}
      HML_ENV_FILE: ${{ vars.HML_ENV_FILE }}
      HML_DATA_DIR: ${{ vars.HML_DATA_DIR }}
      HML_COMPOSE_PROJECT_NAME: ${{ vars.HML_COMPOSE_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Preparar autenticação temporária
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-auth-hml-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Autenticar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.HML_GHCR_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Atualizar homologação
        run: bash scripts/deploy-hml.sh
      - name: Limpar autenticação temporária
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
