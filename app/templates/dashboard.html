<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Análise de Ambiente — {{ cliente_id }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/navigation.js" defer></script>
</head>
<body>
    {% set active_page = "diagnostics" %}
    {% include "_header.html" %}

    <main id="main-content" tabindex="-1" class="page">
        <div class="eyebrow">Análise geral do ambiente</div>
        <h1>{{ cliente_id }}</h1>
        <div class="meta">Banco: <strong>{{ db_type }}</strong></div>

        <button id="btn-executar">Executar Análise</button>
        <button id="btn-pdf" class="btn-secundario" style="display:none;">Baixar Relatório PDF</button>
        <div id="resumo"></div>
        <div id="resultado" role="region" aria-label="Resultados da análise"></div>
    </main>

    <script src="/static/safe-html.js"></script>
    <script>
        const sessionId = {{ session_id | tojson }};
        const checks = {{ checks | tojson }};
        const btn = document.getElementById("btn-executar");
        const btnPdf = document.getElementById("btn-pdf");
        const resumoDiv = document.getElementById("resumo");
        const resultadoDiv = document.getElementById("resultado");
        let ultimoResultado = null;
        const pillGroups = new Map();

        function renderTabela(linhas, titulo = "Dados do diagnóstico") {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            const temStatus = "STATUS" in linhas[0];
            const colunas = Object.keys(linhas[0]).filter(c => c !== "STATUS");
            let html = `<div class="table-scroll" role="region" aria-label="${escapeHTML(titulo)}" tabindex="0"><table><thead><tr>`;
            colunas.forEach(c => html += `<th>${escapeHTML(c)}</th>`);
            html += "</tr></thead><tbody>";
            linhas.forEach(row => {
                const classe = temStatus && String(row.STATUS).toLowerCase() === "alerta" ? ' class="alerta"' : "";
                html += `<tr${classe}>` + colunas.map((c, index) => `<td>${classe && index === 0 ? '<span class="status-label alerta">Alerta</span> ' : ''}${escapeHTML(row[c])}</td>`).join("") + "</tr>";
            });
            html += "</tbody></table></div>";
            return html;
        }

        function renderCards(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = '<div class="cards-grid">';
            linhas.forEach(row => {
                const rawStatus = String(row.STATUS || "indefinido").toLowerCase();
                const status = ["ok", "alerta", "indefinido"].includes(rawStatus) ? rawStatus : "indefinido";
                const esperado = row.ESPERADO ?? "";
                const atual = row.ATUAL ?? "";
                html += `
                    <div class="card ${status}">
                        <div class="titulo">${escapeHTML(row.PARAMETRO)}</div>
                        <span class="status-label ${status}">${({ok: "OK", alerta: "Alerta", indefinido: "Sem baseline"})[status]}</span>
                        <div class="linha"><span>Esperado</span><span class="valor">${escapeHTML(esperado)}</span></div>
                        <div class="linha"><span>Atual</span><span class="valor">${escapeHTML(atual)}</span></div>
                    </div>`;
            });
            html += "</div>";
            return html;
        }

        function renderContagem(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = '<div class="contagem-grid">';
            linhas.forEach((row, idx) => {
                const status = String(row.STATUS || "").toLowerCase() === "alerta" ? "alerta" : "";
                const detalhe = String(row.DETALHE ?? "");

                // Convenção: se o DETALHE tem " · ", a primeira parte é um
                // resumo (ex: "média: 47.5 logins/dia") e o resto é uma
                // lista "item, item, item" que vira pills. Sem " · ",
                // trata o DETALHE inteiro como a lista.
                const partes = detalhe.split(" · ");
                const temResumo = partes.length > 1;
                const resumo = temResumo ? partes[0] : "";
                const listaBruta = temResumo ? partes.slice(1).join(" · ") : detalhe;
                const itens = listaBruta ? listaBruta.split(", ").filter(Boolean) : [];

                let pillsHtml = "";
                if (itens.length) {
                    const LIMITE = 5;
                    const visiveis = itens.slice(0, LIMITE);
                    const ocultos = itens.slice(LIMITE);
                    const idPills = `pills-${pillGroups.size}`;
                    pillGroups.set(idPills, ocultos);
                    pillsHtml = `<div class="pill-list" id="${idPills}">` +
                        visiveis.map(i => `<span class="pill">${escapeHTML(i)}</span>`).join("") +
                        (ocultos.length
                            ? `<button type="button" class="pill pill-mais" data-pills="${idPills}">+${ocultos.length} mais</button>`
                            : "") +
                        `</div>`;
                }

                html += `
                    <div class="contagem-card ${status}">
                        <div class="titulo">${escapeHTML(row.TITULO)}</div>
                        <div class="numero">${escapeHTML(row.CONTAGEM)}</div>
                        ${resumo ? `<div class="resumo-linha">${escapeHTML(resumo)}</div>` : ""}
                        ${pillsHtml}
                    </div>`;
            });
            html += "</div>";
            return html;
        }

        function expandirPills(idPills, ocultos) {
            const container = document.getElementById(idPills);
            const botaoMais = container.querySelector(".pill-mais");
            if (botaoMais) botaoMais.remove();
            ocultos.forEach(i => {
                const span = document.createElement("span");
                span.className = "pill";
                span.textContent = i;
                container.appendChild(span);
            });
        }

        resultadoDiv.addEventListener("click", event => {
            const trigger = event.target.closest(".pill-mais");
            if (trigger && resultadoDiv.contains(trigger)) {
                const id = trigger.dataset.pills;
                expandirPills(id, pillGroups.get(id) || []);
                pillGroups.delete(id);
            }
        });

        function contarStatus(data) {
            const contagem = { ok: 0, alerta: 0, indefinido: 0 };
            checks.forEach(check => {
                const linhas = data[check.id];
                if (!linhas) return;
                linhas.forEach(row => {
                    if (!("STATUS" in row)) return;
                    const s = String(row.STATUS || "").toLowerCase();
                    if (contagem[s] !== undefined) contagem[s]++;
                });
            });
            return contagem;
        }

        function renderResumo(contagem) {
            return `
                <div class="resumo-alertas">
                    <div class="resumo-chip"><span class="ponto alerta"></span><span class="num">${contagem.alerta}</span> em alerta</div>
                    <div class="resumo-chip"><span class="ponto indefinido"></span><span class="num">${contagem.indefinido}</span> sem baseline</div>
                    <div class="resumo-chip"><span class="ponto ok"></span><span class="num">${contagem.ok}</span> ok</div>
                </div>`;
        }

        function mensagemErro(data, fallback) {
            const message = typeof data.erro === "string" ? data.erro : fallback;
            const reference = typeof data.referencia === "string" ? ` Referência: ${data.referencia}.` : "";
            return message + reference;
        }

        btn.addEventListener("click", async () => {
            btn.disabled = true;
            btn.textContent = "Executando...";
            resumoDiv.innerHTML = "";
            resultadoDiv.innerHTML = "";
            ultimoResultado = null;
            btnPdf.style.display = "none";
            pillGroups.clear();

            try {
                const resp = await fetch(`/analise/${encodeURIComponent(sessionId)}/executar`, { method: "POST" });
                const data = await resp.json();
                if (!resp.ok || data.erro) {
                    resultadoDiv.innerHTML = `<p class="erro" role="alert">${escapeHTML(mensagemErro(data, "Falha ao executar análise."))}</p>`;
                    return;
                }

                resumoDiv.innerHTML = renderResumo(contarStatus(data));
                ultimoResultado = data;
                btnPdf.style.display = "inline-block";

                checks.forEach(check => {
                    const erro = data[`${check.id}_erro`];
                    let corpo;
                    if (erro) {
                        corpo = `<p class="erro" role="alert">Erro: ${escapeHTML(erro)}</p>`;
                    } else if (check.exibicao === "cards") {
                        corpo = renderCards(data[check.id]);
                    } else if (check.exibicao === "contagem") {
                        corpo = renderContagem(data[check.id]);
                    } else {
                        corpo = renderTabela(data[check.id], check.titulo);
                    }
                    resultadoDiv.innerHTML += `<section><h2>${escapeHTML(check.titulo)}</h2>${corpo}</section>`;
                });
            } catch (e) {
                resultadoDiv.innerHTML = '<p class="erro" role="alert">Falha ao executar análise. Tente novamente.</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = "Executar Análise";
            }
        });

        btnPdf.addEventListener("click", async () => {
            if (!ultimoResultado) return;
            btnPdf.disabled = true;
            btnPdf.textContent = "Gerando PDF...";
            try {
                const resp = await fetch(`/analise/${encodeURIComponent(sessionId)}/relatorio`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(ultimoResultado),
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    alert(mensagemErro(data, "Não foi possível gerar o PDF."));
                    return;
                }
                const blob = await resp.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `analise-ambiente-${sessionId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert("Não foi possível gerar o PDF. Tente novamente.");
            } finally {
                btnPdf.disabled = false;
                btnPdf.textContent = "Baixar Relatório PDF";
            }
        });
    </script>
</body>
</html>
